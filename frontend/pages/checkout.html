<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SmartCart</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>

<header>
    <div class="logo">SmartCart</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<section class="checkout-section">


<form class="auth-box" id="checkoutForm">

    <h2>Checkout</h2>

    <h3>Delivery Information</h3>

    <input type="text" id="customerName"
        placeholder="Full Name" required>

    <input type="tel" id="phone"
        placeholder="Phone Number" required>

    <textarea id="address"
        placeholder="Delivery Address" required></textarea>

    <input type="text" id="city"
        placeholder="City" required>

    <input type="text" id="pincode"
        placeholder="Pincode" required>

    <h3>Payment Method</h3>

    <label>
        <input type="radio" name="payment"
            value="COD" checked>
        Cash On Delivery
    </label>

    <br><br>

    <h3>Order Total: ₹<span id="checkoutTotal">0.00</span></h3>

    <button type="submit" id="placeOrderBtn">Place Order</button>

</form>


</section>

<script src="../js/checkout.js"></script>

</body>
</html>
