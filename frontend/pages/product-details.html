<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - SmartCart</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/products.css">

    <style>
        .details-section {
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }

        .product-card {
            background: white;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 350px;
            object-fit: contain;
        }

        .product-card h1 {
            margin: 20px 0;
        }

        .product-card h2 {
            color: #e63946;
        }

        .product-card select {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .product-card button {
            padding: 12px 20px;
            margin: 10px 5px 10px 0;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            background: #222;
            color: white;
        }

        .product-card button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .product-card a {
            display: inline-block;
            margin-top: 15px;
        }

        .product-image-placeholder {
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee;
        }
    </style>

</head>

<body>

<header>

    <div class="logo">SmartCart</div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="wishlist.html">Wishlist</a>
    </nav>

</header>

<section class="details-section" id="productDetails">

    <h2>Loading product details...</h2>

</section>

<script src="../js/product-details.js"></script>

</body>
</html>
